<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fredy AI One Day — Chat dengan AI via Genfity">
  <title>Fredy AI One Day — Fredi Susanto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #0a0a1a; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; }
nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(10,10,26,.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.06); }
.nav-inner { max-width: 1100px; margin: auto; display: flex; align-items: center; justify-content: space-between; padding: .8rem 1.5rem; }
.logo { font-weight: 800; font-size: 1.15rem; background: linear-gradient(135deg,#38bdf8,#a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
.nav-links a { color: #94a3b8; text-decoration: none; font-size: .9rem; font-weight: 500; padding: .4rem .8rem; border-radius: 8px; transition: all .2s; }
.nav-links a:hover { color: #f1f5f9; background: rgba(255,255,255,.05); }
.chat-container { max-width: 900px; margin: 5rem auto 1rem; padding: 0 1rem; flex: 1; width: 100%; display: flex; flex-direction: column; }
.chat-header { margin-bottom: 1rem; }
.chat-header h1 { font-size: 1.5rem; font-weight: 700; }
.chat-header h1 span { color: #a78bfa; }
.chat-header p { color: #64748b; font-size: .85rem; margin-top: .2rem; }
.model-bar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
.model-bar select, .model-bar button {
  padding: .5rem .9rem; border-radius: 10px; border: 1px solid rgba(255,255,255,.1);
  background: rgba(15,23,42,.8); color: #e2e8f0; font-size: .85rem; font-family: inherit; cursor: pointer; outline: none;
}
.model-bar select { flex: 1; min-width: 200px; }
.model-bar select option { background: #1e293b; }
.model-bar button { background: linear-gradient(135deg,#38bdf8,#a78bfa); color: #0a0a1a; font-weight: 600; border: none; }
.model-bar button:hover { opacity: .9; }
.chat-messages { flex: 1; overflow-y: auto; padding: 1rem 0; min-height: 300px; max-height: 60vh; }
.msg { display: flex; gap: .75rem; margin-bottom: 1.25rem; }
.msg.user { flex-direction: row-reverse; }
.msg-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .85rem; flex-shrink: 0; }
.msg.user .msg-avatar { background: linear-gradient(135deg,#38bdf8,#a78bfa); color: #0a0a1a; }
.msg.assistant .msg-avatar { background: rgba(30,41,59,.8); border: 1px solid rgba(255,255,255,.1); color: #94a3b8; }
.msg-bubble { max-width: 80%; padding: .8rem 1rem; border-radius: 16px; font-size: .9rem; line-height: 1.6; white-space: pre-wrap; }
.msg.user .msg-bubble { background: linear-gradient(135deg,#38bdf8,#a78bfa); color: #0a0a1a; border-bottom-right-radius: 4px; }
.msg.assistant .msg-bubble { background: rgba(30,41,59,.6); border: 1px solid rgba(255,255,255,.06); border-bottom-left-radius: 4px; }
.msg.assistant.loading .msg-bubble::after { content: '...'; animation: dots 1.5s steps(3) infinite; }
@keyframes dots { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }
.msg.assistant.error .msg-bubble { border-color: rgba(239,68,68,.3); color: #fca5a5; }
.input-bar { display: flex; gap: .5rem; padding: .75rem 0; border-top: 1px solid rgba(255,255,255,.06); margin-top: auto; }
.input-bar textarea {
  flex: 1; padding: .75rem 1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,.1);
  background: rgba(15,23,42,.8); color: #e2e8f0; font-size: .9rem; font-family: inherit; resize: none; outline: none; min-height: 48px; max-height: 150px;
}
.input-bar textarea:focus { border-color: rgba(56,189,248,.4); }
.input-bar button {
  width: 48px; height: 48px; border-radius: 12px; border: none;
  background: linear-gradient(135deg,#38bdf8,#a78bfa); color: #0a0a1a; font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
}
.input-bar button:hover { opacity: .9; }
.input-bar button:disabled { opacity: .4; cursor: not-allowed; }
.usage-info { text-align: center; font-size: .75rem; color: #475569; padding: .5rem 0 1rem; }
.input-bar .upload-btn { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); background: rgba(15,23,42,.8); color: #94a3b8; cursor: pointer; flex-shrink: 0; transition: all .2s; }
.input-bar .upload-btn:hover { background: rgba(56,189,248,.1); color: #38bdf8; }
.dl-btn { display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .6rem;border-radius:6px;background:rgba(56,189,248,.1);color:#38bdf8;font-size:.75rem;cursor:pointer;transition:all .2s }
.dl-btn:hover { background:rgba(56,189,248,.2); }
.file-preview { padding: .5rem .75rem; margin-top: .25rem; border-radius: 10px; background: rgba(15,23,42,.6); border: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: .75rem; }
.file-preview .fp-name { font-size: .85rem; color: #e2e8f0; max-width: 150px; overflow: hidden; text-overflow: ellipsis; display: inline-block; }
.file-preview .fp-remove { color: #ef4444; cursor: pointer; font-size: .9rem; margin-left: .2rem; }
@media (max-width: 640px) {
  .chat-container { margin-top: 4.5rem; padding: 0 .75rem; }
  .msg-bubble { max-width: 90%; font-size: .85rem; }
  .model-bar select { min-width: 140px; font-size: .8rem; }
}
</style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="logo">Fredi Susanto</a>
      <div class="nav-links">
        <a href="/">Beranda</a>
        <a href="/portfolio">Portofolio</a>
      </div>
    </div>
  </nav>

  <div class="chat-container">
    <div class="chat-header">
      <h1>Fredy <span>AI One Day</span></h1>
      <p>Paket sehari — Claude Opus 4.8, GPT-5.5, DeepSeek V4, Qwen 3.7, dan banyak lagi</p>
    </div>

    <div class="model-bar">
      <select id="modelSelect">
        <optgroup label="Claude (Anthropic)">
          <option value="genfity/claude-opus-4.8">Claude Opus 4.8</option>
          <option value="genfity/claude-opus-4.8-thinking">Claude Opus 4.8 Thinking</option>
          <option value="genfity/claude-opus-4.7">Claude Opus 4.7</option>
          <option value="genfity/claude-opus-4.6">Claude Opus 4.6</option>
          <option value="genfity/claude-sonnet-4.6">Claude Sonnet 4.6</option>
          <option value="genfity/claude-haiku-4.5">Claude Haiku 4.5</option>
        </optgroup>
        <optgroup label="GPT (OpenAI)">
          <option value="genfity/gpt-5.5">GPT 5.5</option>
          <option value="genfity/gpt-5.4">GPT 5.4</option>
          <option value="genfity/gpt-5.4-mini">GPT 5.4 Mini</option>
          <option value="genfity/gpt-5.3-codex">GPT 5.3 Codex</option>
        </optgroup>
        <optgroup label="DeepSeek">
          <option value="genfity/deepseek-v4-pro">DeepSeek V4 Pro</option>
          <option value="genfity/deepseek-v4-flash">DeepSeek V4 Flash</option>
          <option value="genfity/deepseek-v4-flash:free">DeepSeek V4 Flash Free</option>
          <option value="genfity/deepseek-3.2">DeepSeek 3.2</option>
        </optgroup>
        <optgroup label="Qwen">
          <option value="genfity/Qwen3.7-Max">Qwen 3.7 Max</option>
          <option value="genfity/qwen3.6-plus">Qwen 3.6 Plus</option>
          <option value="genfity/qwen3.6-27b">Qwen 3.6 27B</option>
          <option value="genfity/qwen3.5-397b-a17b">Qwen 3.5 397B</option>
          <option value="genfity/qwen-3.5">Qwen 3.5</option>
        </optgroup>
        <optgroup label="Lainnya">
          <option value="genfity/auto">Auto (Best Match)</option>
          <option value="genfity/auto-mini">Auto Mini (Cepat)</option>
          <option value="genfity/kimi-k2.6">Kimi K2.6</option>
          <option value="genfity/glm-5.1">GLM 5.1</option>
          <option value="genfity/mimo-v2.5-pro">Xiaomi MiMo Pro</option>
        </optgroup>
      </select>
      <button id="newChatBtn"><i class="fas fa-plus"></i> Baru</button>
      <button id="settingsBtn" onclick="toggleSettings()" style="background:none;border:1px solid rgba(255,255,255,.1);color:#94a3b8;padding:.5rem .7rem"><i class="fas fa-key"></i></button>
    </div>
    <div id="settingsPanel" style="display:none;margin-bottom:1rem;padding:.75rem 1rem;border-radius:12px;background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.06)">
      <label style="font-size:.85rem;color:#94a3b8;display:block;margin-bottom:.4rem">API Key Genfity <span style="color:#f87171;font-size:.75rem">— ganti jika expired</span></label>
      <div style="display:flex;gap:.5rem">
        <input type="text" id="apiKeyInput" style="flex:1;padding:.6rem .8rem;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);color:#e2e8f0;font-size:.85rem;font-family:monospace;outline:none" placeholder="genfity_...">
        <button onclick="saveApiKey()" style="padding:.6rem 1rem;border-radius:8px;border:none;background:linear-gradient(135deg,#38bdf8,#a78bfa);color:#0a0a1a;font-weight:600;font-size:.85rem;cursor:pointer">Simpan</button>
      </div>
      <div id="keyStatus" style="font-size:.8rem;margin-top:.4rem;color:#64748b"></div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="input-bar">
      <label class="upload-btn"><i class="fas fa-paperclip"></i><input type="file" id="fileInput" accept="image/*,.pdf,.docx,.doc,.txt" hidden multiple onchange="handleFiles(event)"></label>
      <textarea id="chatInput" rows="1" placeholder="Ketik pesan..." onkeydown="if(event.key==='enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
      <button id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
    <div id="filePreview" class="file-preview" style="display:none"></div>
    <div class="usage-info">Langganan: Token Tak Terbatas 1 Hari + Opus 4.8 — 0/1000 permintaan hari ini</div>
  </div>

<script>
const BASE_URL = "/api/genfity_proxy";
let messages = [{ role: "system", content: "Kamu adalah asisten AI bernama Fredy AI. Jawab dengan ramah dan informatif dalam bahasa Indonesia." }];
let pendingFile = null;

function getApiKey() {
  return localStorage.getItem("genfity_key") || "genfity_67041d941c16155f2b9ada47f66dc1d12fadd580";
}

function toggleSettings() {
  const p = document.getElementById("settingsPanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
  if (p.style.display === "block") document.getElementById("apiKeyInput").value = getApiKey();
}

function saveApiKey() {
  const val = document.getElementById("apiKeyInput").value.trim();
  if (!val) { document.getElementById("keyStatus").textContent = "❌ Key tidak boleh kosong"; return; }
  localStorage.setItem("genfity_key", val);
  document.getElementById("keyStatus").textContent = "✅ Key tersimpan!";
  setTimeout(() => document.getElementById("settingsPanel").style.display = "none", 1000);
}

function addMsg(role, content, extra) {
  const el = document.getElementById("chatMessages");
  const d = document.createElement("div");
  d.className = "msg " + role + (extra || "");
  const avatar = role === "user" ? `<div class="msg-avatar"><i class="fas fa-user"></i></div>` : `<div class="msg-avatar"><i class="fas fa-robot"></i></div>`;
  d.innerHTML = avatar + `<div class="msg-bubble">${content.replace(/\n/g, '<br>')}</div>`;
  if (role === "assistant" && content && !extra?.includes("loading") && !extra?.includes("error")) {
    const act = document.createElement("div");
    act.style.cssText = "display:flex;gap:.4rem;margin-top:.5rem";
    const pdfBtn = document.createElement("span");
    pdfBtn.className = "dl-btn";
    pdfBtn.innerHTML = '<i class="fas fa-file-pdf"></i> PDF';
    pdfBtn.onclick = () => downloadPDF(content);
    act.appendChild(pdfBtn);
    const docxBtn = document.createElement("span");
    docxBtn.className = "dl-btn";
    docxBtn.innerHTML = '<i class="fas fa-file-word"></i> Word';
    docxBtn.onclick = () => downloadDOCX(content);
    act.appendChild(docxBtn);
    d.querySelector(".msg-bubble").appendChild(act);
  }
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  return d;
}

let pendingFiles = [];

async function handleFiles(e) {
  const files = Array.from(e.target.files);
  const maxNew = 10 - pendingFiles.length;
  if (files.length > maxNew) {
    document.getElementById("keyStatus").textContent = `⚠️ Maksimal 10 file, ${maxNew} slot tersisa`;
    document.getElementById("keyStatus").style.display = "block";
  }
  for (const f of files.slice(0, maxNew)) {
    if (f.type.startsWith("image/")) {
      const b64 = await toBase64(f);
      pendingFiles.push({ type: "image", data: b64, name: f.name });
    } else {
      const text = await extractText(f);
      pendingFiles.push({ type: "text", data: text, name: f.name });
    }
  }
  renderFilePreviews();
  e.target.value = "";
}

function renderFilePreviews() {
  const fp = document.getElementById("filePreview");
  if (!pendingFiles.length) { fp.style.display = "none"; return; }
  fp.innerHTML = pendingFiles.map((pf, i) => {
    if (pf.type === "image") {
      return `<span style="display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .6rem;background:rgba(0,0,0,.3);border-radius:6px;font-size:.8rem;white-space:nowrap">
        <img src="${pf.data}" style="width:28px;height:28px;border-radius:4px;object-fit:cover">
        <span class="fp-name">${pf.name}</span>
        <span class="fp-remove" onclick="removeFile(${i})"><i class="fas fa-times"></i></span>
      </span>`;
    }
    const icon = pf.name.endsWith(".pdf") ? "fa-file-pdf" : pf.name.endsWith(".docx") ? "fa-file-word" : "fa-file-alt";
    return `<span style="display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .6rem;background:rgba(0,0,0,.3);border-radius:6px;font-size:.8rem;white-space:nowrap">
      <i class="fas ${icon}" style="color:#38bdf8"></i>
      <span class="fp-name">${pf.name}</span>
      <span class="fp-remove" onclick="removeFile(${i})"><i class="fas fa-times"></i></span>
    </span>`;
  }).join("");
  fp.style.display = "flex";
  fp.style.flexWrap = "wrap";
  fp.style.gap = ".4rem";
}

function removeFile(idx) {
  pendingFiles.splice(idx, 1);
  renderFilePreviews();
}

function toBase64(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
}

async function extractText(f) {
  const name = f.name.toLowerCase();
  if (name.endsWith(".txt")) return await f.text();
  if (name.endsWith(".pdf")) {
    const buf = await f.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const p = await pdf.getPage(i);
      const t = await p.getTextContent();
      text += t.items.map(x => x.str).join(" ") + "\n";
    }
    return text;
  }
  if (name.endsWith(".docx")) {
    const buf = await f.arrayBuffer();
    const r = await mammoth.extractRawText({ arrayBuffer: buf });
    return r.value;
  }
  if (name.endsWith(".doc")) return "[DOC file — konversi ke .docx untuk hasil optimal]";
  return "[File tidak didukung]";
}

function downloadPDF(text) {
  const html = `<html><head><meta charset="utf-8"><style>body{font-family:sans-serif;padding:2rem;line-height:1.6;white-space:pre-wrap}</style></head><body>${text.replace(/\n/g,"<br>")}</body></html>`;
  const blob = new Blob([html], { type: "application/pdf" });
  // Use html2pdf for proper PDF
  const el = document.createElement("div");
  el.innerHTML = text.replace(/\n/g, "<br>");
  el.style.cssText = "padding:2rem;font-family:sans-serif;font-size:14px;line-height:1.6;white-space:pre-wrap;position:absolute;left:-9999px";
  document.body.appendChild(el);
  html2pdf().set({ filename: "fredy-ai-response.pdf", html2canvas: { scale: 2 } }).from(el).save().then(() => document.body.removeChild(el));
}

function downloadDOCX(text) {
  const lines = text.split("\n");
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>${lines.map(l => `<p>${l}</p>`).join("")}</body></html>`;
  const blob = new Blob([html], { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fredy-ai-response.docx";
  a.click();
  URL.revokeObjectURL(a.href);
}

async function callGenfity(msgs, model, maxTok) {
  const ep = model.startsWith("genfity/claude") ? "anthropic" : "chat";
  const resp = await fetch(BASE_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Genfity-Key": getApiKey() },
    body: JSON.stringify({ model, messages: msgs, max_tokens: maxTok || 4096, _endpoint: ep })
  });
  const text = await resp.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { throw new Error("Server: " + text.slice(0, 200)); }
  if (!resp.ok) throw new Error(data.error?.message || resp.status);
  return data.choices?.[0]?.message?.content || data.content?.[0]?.text || JSON.stringify(data);
}

function splitText(text, maxLen) {
  const parts = [], paragraphs = text.split(/\n\n+/);
  let current = "";
  for (const p of paragraphs) {
    if ((current + "\n\n" + p).length > maxLen && current.length > 100) {
      parts.push(current.trim()); current = p;
    } else current += (current ? "\n\n" : "") + p;
  }
  if (current.trim()) parts.push(current.trim());
  return parts;
}

async function sendMessage() {
  const input = document.getElementById("chatInput");
  const btn = document.getElementById("sendBtn");
  const text = input.value.trim();
  if ((!text && !pendingFiles.length) || btn.disabled) return;

  input.value = "";
  input.style.height = "auto";

  const images = pendingFiles.filter(f => f.type === "image");
  const docs = pendingFiles.filter(f => f.type === "text");
  let content, displayText = text || "";
  let isLong = false;

  if (images.length) {
    const parts = [];
    if (text) parts.push({ type: "text", text });
    for (const img of images) parts.push({ type: "image_url", image_url: { url: img.data } });
    content = parts;
    displayText += (text ? "\n" : "") + images.map(i => "📷 " + i.name).join("\n");
  }
  if (docs.length) {
    const docText = docs.map(d => `--- File: ${d.name}\n${d.data}`).join("\n\n");
    const msg = text ? `${text}\n\n${docText}` : docText;
    content = content ? (Array.isArray(content) ? [...content, { type: "text", text: msg }] : msg) : msg;
    displayText += (displayText ? "\n" : "") + docs.map(d => "📄 " + d.name).join("\n");
    isLong = (typeof content === "string" ? content : msg).length > 5000;
  }
  if (!content) content = text;

  addMsg("user", displayText + (isLong ? "\n⏳ Dokumen panjang, diproses per bagian..." : ""));
  const msgContent = typeof content === "string" ? content : content.map(c => c.text || "[image]").join(" ");
  if (typeof content === "string") messages.push({ role: "user", content });
  else messages.push({ role: "user", content: msgContent + ` [${images.length} image(s)]` });

  pendingFiles = [];
  renderFilePreviews();
  btn.disabled = true;
  const loading = addMsg("assistant", "", " loading");
  const model = document.getElementById("modelSelect").value;

  try {
    let reply;
    if (isLong && typeof content === "string") {
      // Extract instructions (revisi) from first part, then split document
      const parts = splitText(content, 4000);
      const instructions = parts[0]; // revision comments etc
      const docChunks = parts.slice(1);
      let results = [];
      for (let i = 0; i < docChunks.length; i++) {
        loading.querySelector(".msg-bubble").textContent = `⏳ Memproses bagian ${i+1}/${docChunks.length}...`;
        const prompt = `Instruksi revisi:\n${instructions}\n\nBagian dokumen ${i+1} dari ${docChunks.length} yang perlu diperbaiki:\n${docChunks[i]}\n\nTerapkan revisi di atas pada bagian ini. Output hanya bagian yang sudah diperbaiki, tanpa komentar tambahan.`;
        const r = await callGenfity([{ role: "system", content: "Kamu adalah asisten akademik. Terapkan revisi pada teks yang diberikan." }, { role: "user", content: prompt }], model, 4096);
        results.push(r);
      }
      reply = results.join("\n\n");
    } else {
      const body = typeof content === "string"
        ? { model, messages, max_tokens: 4096 }
        : { model, messages: [...messages.slice(0, -1), { role: "user", content }], max_tokens: 4096 };
      reply = await callGenfity(body.messages, model, 4096);
    }
    messages.push({ role: "assistant", content: reply });
    loading.querySelector(".msg-bubble").innerHTML = reply.replace(/\n/g, "<br>");
    const act = document.createElement("div");
    act.style.cssText = "display:flex;gap:.4rem;margin-top:.5rem";
    const pdfBtn = document.createElement("span"); pdfBtn.className = "dl-btn"; pdfBtn.innerHTML = '<i class="fas fa-file-pdf"></i> PDF';
    pdfBtn.onclick = () => downloadPDF(reply);
    act.appendChild(pdfBtn);
    const docxBtn = document.createElement("span"); docxBtn.className = "dl-btn"; docxBtn.innerHTML = '<i class="fas fa-file-word"></i> Word';
    docxBtn.onclick = () => downloadDOCX(reply);
    act.appendChild(docxBtn);
    loading.querySelector(".msg-bubble").appendChild(act);
    loading.classList.remove("loading");
  } catch (e) {
    loading.classList.remove("loading");
    loading.classList.add("error");
    loading.querySelector(".msg-bubble").textContent = "Error: " + e.message;
  }
  btn.disabled = false;
}

document.getElementById("newChatBtn").onclick = () => {
  messages = [{ role: "system", content: "Kamu adalah asisten AI bernama Fredy AI. Jawab dengan ramah dan informatif dalam bahasa Indonesia." }];
  document.getElementById("chatMessages").innerHTML = "";
  pendingFiles = [];
  renderFilePreviews();
};
</script>
