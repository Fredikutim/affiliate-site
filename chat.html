<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Service AI - FREDI SUSANTO</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a1a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      max-height: 800px;
      background: linear-gradient(135deg, rgba(30,41,59,.95), rgba(15,23,42,.95));
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,.1);
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      padding: 1.5rem;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }

    .chat-header-info h2 {
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
    }

    .chat-header-info p {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .chat-header-status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      gap: 0.75rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.bot {
      justify-content: flex-start;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .bot .message-content {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: #e2e8f0;
    }

    .user .message-content {
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      color: white;
    }

    .message-time {
      font-size: 0.75rem;
      color: #64748b;
      display: flex;
      align-items: flex-end;
    }

    .chat-input-area {
      padding: 1rem;
      border-top: 1px solid rgba(255,255,255,.1);
      background: rgba(10,10,26,.5);
    }

    .quick-replies {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .quick-reply {
      padding: 0.5rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      color: #38bdf8;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .quick-reply:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: translateY(-2px);
    }

    .input-group {
      display: flex;
      gap: 0.75rem;
    }

    .input-group input {
      flex: 1;
      padding: 0.75rem 1rem;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      color: #e2e8f0;
      font-family: inherit;
      transition: all 0.2s;
    }

    .input-group input:focus {
      outline: none;
      background: rgba(255,255,255,.08);
      border-color: rgba(56,189,248,.3);
    }

    .input-group input::placeholder {
      color: #64748b;
    }

    .send-btn {
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
    }

    .send-btn:active {
      transform: translateY(0);
    }

    .whatsapp-btn {
      width: 100%;
      padding: 0.75rem;
      background: #25D366;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .whatsapp-btn:hover {
      background: #20ba5a;
      transform: translateY(-2px);
    }

    .typing-indicator {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-10px);
      }
    }

    /* Scrollbar */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(255,255,255,.05);
      border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(56,189,248,.3);
      border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(56,189,248,.5);
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-info">
        <h2>FREDI AI Assistant</h2>
        <p>Siap membantu Anda 24/7</p>
      </div>
      <div class="chat-header-status">
        <div class="status-dot"></div>
        <span>Online</span>
      </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="message-content">
          <p>👋 Halo! Saya FREDI AI Assistant. Bagaimana saya bisa membantu Anda hari ini?</p>
        </div>
        <div class="message-time">08:00</div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <div class="quick-replies" id="quickReplies">
        <button class="quick-reply" onclick="sendQuickReply('Informasi tentang investasi')">💰 Investasi</button>
        <button class="quick-reply" onclick="sendQuickReply('Bantuan teknis')">🔧 Bantuan</button>
        <button class="quick-reply" onclick="sendQuickReply('Promo terbaru')">🎁 Promo</button>
        <button class="quick-reply" onclick="sendQuickReply('Hubungi customer service')">📞 CS</button>
      </div>

      <div class="input-group">
        <input type="text" id="messageInput" placeholder="Ketik pesan Anda..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">
          <i class="fas fa-paper-plane"></i>
          <span>Kirim</span>
        </button>
      </div>

      <button class="whatsapp-btn" onclick="openWhatsApp()">
        <i class="fab fa-whatsapp"></i>
        Chat via WhatsApp (+62 852-2760-0408)
      </button>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const quickReplies = document.getElementById('quickReplies');

    // AI Responses Database
    const aiResponses = {
      'investasi': 'Di platform kami, Anda bisa berinvestasi melalui Ajaib, Binance, dan Indodax. Setiap platform memiliki keuntungan berbeda. Ingin tahu lebih lanjut? 📈',
      'bantuan': 'Kami siap membantu dengan masalah teknis apapun. Apakah ada fitur yang tidak jelas? Atau ingin saya jelaskan cara menggunakan platform? 🔧',
      'promo': 'Saat ini kami sedang memberikan bonus referral menarik! Ajak teman dan dapatkan komisi. Ingin info lebih detail? 🎁',
      'hubungi': 'Untuk layanan pelanggan yang lebih detail, silakan hubungi kami via WhatsApp. Tim kami siap melayani 24/7! 📞',
      'default': 'Terima kasih atas pertanyaan Anda! Saat ini saya sedang memproses informasi. Silakan hubungi customer service kami via WhatsApp untuk respons lebih cepat. 😊'
    };

    function addMessage(text, isUser = false) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
      
      const now = new Date();
      const time = now.getHours().toString().padStart(2, '0') + ':' + 
                   now.getMinutes().toString().padStart(2, '0');

      messageDiv.innerHTML = `
        <div class="message-content">
          <p>${text}</p>
        </div>
        <div class="message-time">${time}</div>
      `;

      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTypingIndicator() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message bot';
      messageDiv.id = 'typingIndicator';
      
      messageDiv.innerHTML = `
        <div class="message-content">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;

      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typingIndicator');
      if (indicator) {
        indicator.remove();
      }
    }

    function getAIResponse(userMessage) {
      const lowerMessage = userMessage.toLowerCase();
      
      for (const [key, response] of Object.entries(aiResponses)) {
        if (lowerMessage.includes(key)) {
          return response;
        }
      }

      // Check for custom keywords
      if (lowerMessage.includes('halo') || lowerMessage.includes('hi') || lowerMessage.includes('hello')) {
        return 'Halo! 👋 Senang bertemu Anda. Ada yang bisa saya bantu? 😊';
      }
      if (lowerMessage.includes('terima kasih') || lowerMessage.includes('thanks')) {
        return 'Sama-sama! Senang bisa membantu Anda. Ada pertanyaan lain? 🙌';
      }
      if (lowerMessage.includes('siapa')) {
        return 'Saya FREDI AI Assistant, asisten virtual yang siap membantu Anda dengan informasi seputar investasi, crypto, belanja, travel, teknologi, dan keuangan digital. 🤖';
      }

      return aiResponses.default;
    }

    function sendMessage() {
      const message = messageInput.value.trim();
      if (message === '') return;

      // Add user message
      addMessage(message, true);
      messageInput.value = '';

      // Show typing indicator
      showTypingIndicator();

      // Simulate AI response delay
      setTimeout(() => {
        removeTypingIndicator();
        const response = getAIResponse(message);
        addMessage(response, false);

        // Show quick replies after bot responds
        if (quickReplies) {
          quickReplies.style.display = 'grid';
        }
      }, 1000 + Math.random() * 1000);
    }

    function sendQuickReply(message) {
      addMessage(message, true);
      
      // Hide quick replies after selection
      if (quickReplies) {
        quickReplies.style.display = 'none';
      }

      showTypingIndicator();

      setTimeout(() => {
        removeTypingIndicator();
        const response = getAIResponse(message);
        addMessage(response, false);

        if (quickReplies) {
          quickReplies.style.display = 'grid';
        }
      }, 1000 + Math.random() * 1000);
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    function openWhatsApp() {
      const phoneNumber = '6285227600408'; // Nomor Anda dengan kode negara
      const message = 'Halo! Saya ingin bertanya lebih lanjut tentang layanan FREDI.';
      const encodedMessage = encodeURIComponent(message);
      const whatsappURL = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
      
      window.open(whatsappURL, '_blank');
    }

    // Initial greeting
    setTimeout(() => {
      if (quickReplies) {
        quickReplies.style.display = 'grid';
      }
    }, 500);
  </script>
</body>
</html>
